<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>
        function one(number = 123){
            const strNumber = String(number);
            let result = "";
            for (let i = strNumber.length - 1; i >= 0; i--){
                result += strNumber[i];
            }
            return result;
        }
        
        function two(number = 111333456){
            const strNumber = String(number);
            let result = "";
            for (let i in strNumber){
                if (!result.includes(strNumber[i])) result += strNumber[i];
            }
            return result;
        }

        function three(number = 1355567, n = 5){
            const strNumber = String(number);
            let result = 0;
            for (let i in strNumber){
                if (Number(strNumber[i]) === n) result++;
            }
            return result;
        }

        function four(number = 1135) {
            const binaryNumber = number.toString(2);
            let maxZeros = 0, maxOnes = 0, currentLength = 1;
            for (let i = 1; i < binaryNumber.length; i++){
                if (binaryNumber[i] === binaryNumber[i - 1]) currentLength++;
                else {
                    if (binaryNumber[i - 1] === "0") maxZeros = Math.max(maxZeros, currentLength);
                    else maxOnes = Math.max(maxOnes, currentLength);
                    currentLength = 1;
                }
            }

            if (binaryNumber[-1] === "0") maxZeros = Math.max(maxZeros, currentLength);
            else maxOnes = Math.max(maxOnes, currentLength);

            return maxZeros > maxOnes ? `0: ${maxZeros}` : `1: ${maxOnes}`
        }

        alert(one());
        alert(two());
        alert(three());
        alert(four());
    </script>
</head>
<body></body>
