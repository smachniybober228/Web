<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" type="text/css" href="lab11.css">
    <script defer src="lab11.js"></script>
    <title>Заголовок</title>
    <meta charset="UTF-8">
</head>
<body>
    <main>
    <h1 class="MyH">Список дел</h1>
    <div class="MyInput">
        <input id="NewElementName" type="text" placeholder="Новый элемент списка"/>
        <div class="ButtonsWrapper">
            <button id="createButton">Создать</button>
            <button id="clearButton">Очистить всё</button>
        </div>
    </div>
    <ol id="TodoList"></ol>
    <div class="todo-footer">
        <hr class="footer-line">
        <div class="filter-buttons">
            <button class="filter-btn" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>
    </div>
    </main>
    <footer class="site-footer">
        <hr class="footer-line">
        Copyright &copy
    </footer>
</body>
</html>
